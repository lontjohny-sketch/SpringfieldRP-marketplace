<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Springfield State RP Marketplace</title>
<meta name="description" content="Official marketplace for Springfield State RP.">
<style>
:root{
  --bg:#0b1220; --panel:#131c2e; --panel2:#1a2540; --line:#26365a;
  --text:#e8edf7; --muted:#8fa0c2; --accent:#f5b83d; --accent2:#3d8bf5;
  --good:#3ddc97; --bad:#ff5d6c; --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0}
a{color:var(--accent2)}

/* top bar */
.announce{background:linear-gradient(90deg,var(--accent2),#6a5cf5);text-align:center;padding:8px 16px;font-size:.9rem;font-weight:600}
.announce:empty{display:none}
header.nav{position:sticky;top:0;z-index:20;background:rgba(11,18,32,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav-in{max-width:1200px;margin:auto;display:flex;align-items:center;gap:12px;padding:12px 20px}
.brand{font-weight:800;letter-spacing:.3px;font-size:1.05rem;display:flex;align-items:center;gap:10px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#e0861a);display:grid;place-items:center;color:#1b1200;font-weight:900}
.spacer{flex:1}
.btn{background:var(--panel2);border:1px solid var(--line);padding:9px 16px;border-radius:10px;font-weight:600;transition:.15s}
.btn:hover{border-color:var(--accent2)}
.btn.primary{background:var(--accent);color:#1b1200;border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:.82rem;border-radius:8px}
.cart-count{background:var(--bad);color:#fff;border-radius:99px;padding:0 7px;font-size:.78rem;margin-left:6px}

/* hero */
.hero{text-align:center;padding:64px 20px 40px;background:radial-gradient(900px 300px at 50% 0,rgba(61,139,245,.22),transparent)}
.hero .tag{display:inline-block;border:1px solid var(--line);background:var(--panel);padding:4px 14px;border-radius:99px;color:var(--muted);font-size:.82rem;margin-bottom:18px}
.hero h1{font-size:clamp(2rem,6vw,3.6rem);line-height:1.1;font-weight:900}
.hero h1 span{color:var(--accent)}
.hero p{color:var(--muted);max-width:620px;margin:16px auto 0;font-size:1.05rem}

/* toolbar */
.wrap{max-width:1200px;margin:auto;padding:0 20px 60px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}
.toolbar input,.toolbar select{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;outline:none}
.toolbar input{flex:1;min-width:200px}
.toolbar input:focus,.toolbar select:focus{border-color:var(--accent2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.chip{background:var(--panel);border:1px solid var(--line);padding:7px 16px;border-radius:99px;color:var(--muted);font-weight:600;font-size:.9rem}
.chip.on{background:var(--accent2);border-color:var(--accent2);color:#fff}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;transition:.18s}
.card:hover{transform:translateY(-3px);border-color:var(--accent2)}
.card .pic{height:130px;display:grid;place-items:center;font-size:3.4rem;background:linear-gradient(135deg,var(--panel2),#0f1830);position:relative}
.badge{position:absolute;top:10px;left:10px;background:var(--accent);color:#1b1200;font-size:.7rem;font-weight:800;padding:3px 9px;border-radius:99px;text-transform:uppercase}
.card .body{padding:14px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.card .cat{color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.6px}
.card h3{font-size:1.05rem}
.card p{color:var(--muted);font-size:.88rem;flex:1}
.card .foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.price{font-weight:800;font-size:1.15rem;color:var(--good)}
.stock{font-size:.75rem;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:50px 0}

/* drawer + modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:none}
.overlay.open{display:block}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(420px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:50;transform:translateX(100%);transition:.25s;display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-weight:800}
.drawer .scroll{flex:1;overflow:auto;padding:16px 20px}
.drawer footer{padding:16px 20px;border-top:1px solid var(--line)}
.line{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.line .em{font-size:1.8rem}
.line .info{flex:1}
.line .info small{color:var(--muted)}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:26px;height:26px;border-radius:7px;background:var(--panel2);color:var(--text)}
.total{display:flex;justify-content:space-between;font-weight:800;font-size:1.1rem;margin-bottom:12px}
label.f{display:block;font-size:.82rem;color:var(--muted);margin:10px 0 4px}
.in{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 12px;outline:none}
.in:focus{border-color:var(--accent2)}
textarea.in{resize:vertical;min-height:70px}

.modal{position:fixed;inset:0;z-index:60;display:none;place-items:center;padding:16px;background:rgba(0,0,0,.7)}
.modal.open{display:grid}
.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);width:min(900px,100%);max-height:92vh;overflow:auto}
.box.narrow{width:min(440px,100%)}
.box .h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);font-weight:800;position:sticky;top:0;background:var(--panel);z-index:2}
.box .c{padding:20px}
.tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.tab{background:var(--panel2);border:1px solid var(--line);padding:7px 16px;border-radius:9px;font-weight:600;color:var(--muted)}
.tab.on{background:var(--accent);color:#1b1200;border-color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-weight:600;font-size:.76rem;text-transform:uppercase}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pill{padding:2px 9px;border-radius:99px;font-size:.72rem;font-weight:700}
.pill.new{background:rgba(245,184,61,.18);color:var(--accent)}
.pill.done{background:rgba(61,220,151,.18);color:var(--good)}
.pill.cancel{background:rgba(255,93,108,.18);color:var(--bad)}
.note{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;color:var(--muted);font-size:.84rem;margin-bottom:14px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--good);color:#06281a;padding:11px 22px;border-radius:10px;font-weight:700;z-index:100;transition:.25s}
.toast.show{transform:translateX(-50%)}
.toast.err{background:var(--bad);color:#fff}
footer.site{text-align:center;color:var(--muted);padding:30px 20px;border-top:1px solid var(--line);font-size:.85rem}
@media(max-width:560px){.row2{grid-template-columns:1fr}.nav-in{padding:10px 12px}}
</style>
</head>
<body>

<div class="announce" id="announce"></div>

<header class="nav">
  <div class="nav-in">
    <div class="brand"><div class="logo">S</div><span id="brandName">Springfield State RP</span></div>
    <div class="spacer"></div>
    <button class="btn" id="adminBtn">⚙ Admin</button>
    <button class="btn primary" id="cartBtn">🛒 Cart<span class="cart-count" id="cartCount">0</span></button>
  </div>
</header>

<section class="hero">
  <div class="tag" id="heroTag">Official Server Store</div>
  <h1><span>Springfield State RP</span><br>Marketplace</h1>
  <p id="heroText">Vehicles, properties, clothing and perks for your roleplay character.</p>
</section>

<main class="wrap">
  <div class="toolbar">
    <input id="search" placeholder="Search the marketplace…">
    <select id="sort">
      <option value="featured">Sort: Featured</option>
      <option value="low">Price: Low → High</option>
      <option value="high">Price: High → Low</option>
      <option value="name">Name A–Z</option>
    </select>
  </div>
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
</main>

<footer class="site">© <span id="year"></span> Springfield State RP · Marketplace · Not affiliated with any real-world entity.</footer>

<!-- cart drawer -->
<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer">
  <header><span>Your Cart</span><button class="btn sm" id="closeCart">✕</button></header>
  <div class="scroll" id="cartBody"></div>
  <footer id="cartFoot"></footer>
</aside>

<!-- admin login -->
<div class="modal" id="loginModal">
  <div class="box narrow">
    <div class="h"><span>Admin Login</span><button class="btn sm" data-close="loginModal">✕</button></div>
    <div class="c">
      <label class="f">Passcode</label>
      <input class="in" id="passIn" type="password" placeholder="Enter passcode">
      <button class="btn primary" style="width:100%;margin-top:14px" id="loginGo">Unlock</button>
    </div>
  </div>
</div>

<!-- admin panel -->
<div class="modal" id="adminModal">
  <div class="box">
    <div class="h"><span>Marketplace Control Panel</span>
      <span><button class="btn sm" id="logoutBtn">Lock</button> <button class="btn sm" data-close="adminModal">✕</button></span></div>
    <div class="c">
      <div class="tabs" id="adminTabs">
        <button class="tab on" data-tab="items">Items</button>
        <button class="tab" data-tab="orders">Orders</button>
        <button class="tab" data-tab="settings">Settings</button>
        <button class="tab" data-tab="data">Data / GitHub</button>
      </div>
      <div id="adminBody"></div>
    </div>
  </div>
</div>

<!-- purchase details popup (ads, custom passes, anything flagged in admin) -->
<div class="modal" id="askModal">
  <div class="box narrow">
    <div class="h"><span id="askTitle">Purchase</span><button class="btn sm" data-close="askModal">✕</button></div>
    <div class="c">
      <div class="note" id="askPrice"></div>
      <label class="f" id="askLabel">Details</label>
      <textarea class="in" id="askText" style="min-height:120px" placeholder="Type here…"></textarea>
      <button class="btn primary" style="width:100%;margin-top:14px" id="askGo">Add to cart</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   EDIT THIS BLOCK to change the default store (what GitHub visitors see).
   Admin panel changes are saved in the browser; use Data > Export to
   copy them back into this block and commit to GitHub.
   ===================================================================== */
const DEFAULTS = {
  settings: {
    storeName: "Springfield State RP",
    announcement: "🎉 Welcome to the Springfield State RP Marketplace – new items added weekly!",
    tagline: "Official Server Store",
    heroText: "Vehicles, properties, clothing and perks for your roleplay character.",
    currency: "$",
    passHash: "28d3e3e0ba966a91501c855d19a866cee40cd675d722efd88093a32e96ffd4b6",  // SHA-256 of the admin passcode. Change it in Admin > Settings, then Export.
    webhook: "",              // optional Discord webhook for new orders
    // Order statuses. The first one is applied to every new order. Editable in Admin > Settings.
    statuses: [
      {id:"new",label:"New",color:"#f5b83d"},
      {id:"processing",label:"Processing",color:"#3d8bf5"},
      {id:"delivered",label:"Delivered",color:"#3ddc97"},
      {id:"cancelled",label:"Cancelled",color:"#ff5d6c"}
    ]
  },
  categories: ["Gamepasses","Vehicles","Properties","Clothing","Perks","Services"],
  items: [
    // Gamepasses: currency "R$" = Robux. "link" = your Roblox gamepass URL (optional).
    {id:20,name:"ERLC Ad Gamepass",category:"Gamepasses",price:350,currency:"R$",link:"https://www.roblox.com/game-pass/0000000/Example",ask:true,askLabel:"What should your ad say? Include your business or Discord invite.",stock:-1,emoji:"📢",badge:"Robux",visible:true,desc:"Advertise your business or community in ERLC. Replace the link with your real gamepass."},
    {id:21,name:"Custom Gamepass",category:"Gamepasses",price:500,currency:"R$",link:"",ask:true,askLabel:"Describe the custom pass you want (name, perks, price idea).",stock:-1,emoji:"✨",badge:"Custom",visible:true,desc:"Need something special? Tell staff what you want and we'll make a custom pass."},
    {id:1,name:"Springfield PD Cruiser",category:"Vehicles",price:45000,stock:5,emoji:"🚓",badge:"Popular",visible:true,desc:"Fully liveried patrol vehicle. Requires an approved LEO role."},
    {id:2,name:"Sport Coupe",category:"Vehicles",price:32000,stock:-1,emoji:"🏎️",badge:"",visible:true,desc:"Fast, flashy and perfect for weekend meets."},
    {id:3,name:"Pickup Truck",category:"Vehicles",price:18000,stock:-1,emoji:"🛻",badge:"",visible:true,desc:"Reliable work truck for tradies and farmers."},
    {id:4,name:"Downtown Apartment",category:"Properties",price:120000,stock:3,emoji:"🏢",badge:"Limited",visible:true,desc:"Two-bedroom apartment in central Springfield."},
    {id:5,name:"Suburban House",category:"Properties",price:210000,stock:2,emoji:"🏡",badge:"",visible:true,desc:"Family home with a garage and backyard."},
    {id:6,name:"Business Licence",category:"Perks",price:15000,stock:-1,emoji:"📜",badge:"",visible:true,desc:"Open your own shop or business in the city."},
    {id:7,name:"Designer Outfit Pack",category:"Clothing",price:2500,stock:-1,emoji:"👔",badge:"New",visible:true,desc:"Five exclusive outfits for your character."},
    {id:8,name:"Priority Queue Pass",category:"Perks",price:5000,stock:-1,emoji:"⭐",badge:"",visible:true,desc:"Skip the line when the server is full."},
    {id:9,name:"Custom Licence Plate",category:"Services",price:3500,stock:-1,emoji:"🔖",badge:"",visible:true,desc:"Pick your own plate text (staff approval required)."}
  ]
};

/* ---------- storage ---------- */
const KEY = "ssrp_data_v1", CARTKEY = "ssrp_cart_v1", ORDKEY = "ssrp_orders_v1", AUTHKEY="ssrp_admin_ok";
const clone = o => JSON.parse(JSON.stringify(o));
function load(k, fb){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; }catch(e){ return fb; } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

let data  = load(KEY, null) || clone(DEFAULTS);
function ensureStatuses(){ delete data.settings.passcode; /* old plaintext passcode is dropped */ if(!Array.isArray(data.settings.statuses) || !data.settings.statuses.length) data.settings.statuses = clone(DEFAULTS.settings.statuses); }
data.settings = Object.assign({}, DEFAULTS.settings, data.settings);
ensureStatuses();
let details = load("ssrp_details_v1", {});  // {itemId: buyer's popup answer}
let askId = null;
let cart  = load(CARTKEY, {});       // {itemId: qty}
let orders = load(ORDKEY, []);
let admin = sessionStorage.getItem(AUTHKEY) === "1";
let filter = {cat:"All", q:"", sort:"featured"};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = (n, c) => (c ?? data.settings.currency) + Number(n).toLocaleString();
const cur = i => (i && i.currency) || data.settings.currency;
const fmtTotals = t => Object.entries(t).map(([c,v]) => money(v,c)).join(" + ") || money(0);
const LEGACY = {done:"delivered", cancel:"cancelled"};
const statusOf = id => { const st = data.settings.statuses; return st.find(s => s.id === id) || st.find(s => s.id === LEGACY[id]) || st[0]; };
const statusPill = o => { const s = statusOf(o.status); return `<span class="pill" style="background:${esc(s.color)}2e;color:${esc(s.color)}">${esc(s.label)}</span>`; };
const safeUrl = u => /^https?:\/\//i.test(u||"") ? u : "";
const findItem = id => data.items.find(i => i.id == id);
const persist = () => save(KEY, data);
function toast(msg, err){
  const t = $("#toast"); t.textContent = msg; t.className = "toast show" + (err ? " err" : "");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.className = "toast", 2400);
}

/* ---------- storefront ---------- */
function renderStatic(){
  const s = data.settings;
  document.title = s.storeName + " Marketplace";
  $("#brandName").textContent = s.storeName;
  $("#announce").textContent = s.announcement;
  $("#heroTag").textContent = s.tagline;
  $("#heroText").textContent = s.heroText;
  $("#year").textContent = new Date().getFullYear();
}
function renderChips(){
  const cats = ["All", ...data.categories];
  $("#chips").innerHTML = cats.map(c => `<button class="chip ${filter.cat===c?"on":""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("");
}
function renderGrid(){
  let list = data.items.filter(i => i.visible !== false);
  if(filter.cat !== "All") list = list.filter(i => i.category === filter.cat);
  if(filter.q) list = list.filter(i => (i.name+" "+i.desc+" "+i.category).toLowerCase().includes(filter.q));
  if(filter.sort==="low") list.sort((a,b)=>a.price-b.price);
  if(filter.sort==="high") list.sort((a,b)=>b.price-a.price);
  if(filter.sort==="name") list.sort((a,b)=>a.name.localeCompare(b.name));
  $("#grid").innerHTML = list.length ? list.map(i => {
    const out = i.stock === 0;
    return `<div class="card">
      <div class="pic">${i.badge?`<span class="badge">${esc(i.badge)}</span>`:""}${esc(i.emoji||"📦")}</div>
      <div class="body">
        <div class="cat">${esc(i.category)}</div>
        <h3>${esc(i.name)}</h3>
        <p>${esc(i.desc)}</p>
        <div class="foot">
          <div><div class="price">${money(i.price,cur(i))}</div><div class="stock">${i.stock<0?"In stock":out?"Sold out":i.stock+" left"}</div></div>
          <div style="display:flex;gap:6px">${safeUrl(i.link)?`<a class="btn sm" href="${esc(safeUrl(i.link))}" target="_blank" rel="noopener">Roblox ↗</a>`:""}<button class="btn primary sm" data-add="${i.id}" ${out?"disabled style='opacity:.4;cursor:not-allowed'":""}>Add</button></div>
        </div>
      </div></div>`;
  }).join("") : `<div class="empty" style="grid-column:1/-1">No items match your search.</div>`;
}
function renderAll(){ renderStatic(); renderChips(); renderGrid(); renderCart(); }

/* ---------- cart ---------- */
function cartTotals(){
  const t = {};
  Object.entries(cart).forEach(([id,q]) => { const i = findItem(id); if(i){ const c = cur(i); t[c] = (t[c]||0) + i.price*q; } });
  return t;
}
function renderCart(){
  // drop items that no longer exist
  Object.keys(cart).forEach(id => { if(!findItem(id)) delete cart[id]; });
  Object.keys(details).forEach(id => { if(!cart[id]) delete details[id]; });
  save("ssrp_details_v1", details);
  save(CARTKEY, cart);
  const ids = Object.keys(cart);
  $("#cartCount").textContent = ids.reduce((n,id)=>n+cart[id],0);
  $("#cartBody").innerHTML = ids.length ? ids.map(id => {
    const i = findItem(id);
    return `<div class="line"><div class="em">${esc(i.emoji||"📦")}</div>
      <div class="info"><b>${esc(i.name)}</b><br><small>${money(i.price,cur(i))} each</small>${details[id]?`<br><small style="color:var(--accent)">“${esc(details[id].slice(0,80))}${details[id].length>80?"…":""}” <a href="#" data-editask="${id}">edit</a></small>`:""}</div>
      <div class="qty"><button data-dec="${id}">−</button><b>${cart[id]}</b><button data-inc="${id}">+</button></div></div>`;
  }).join("") : `<div class="empty">Your cart is empty.</div>`;
  $("#cartFoot").innerHTML = ids.length ? `
    <div class="total"><span>Total</span><span>${fmtTotals(cartTotals())}</span></div>
    <label class="f">In-game name / Discord username *</label><input class="in" id="buyerName" placeholder="e.g. JohnDoe#1234" value="${esc(load('ssrp_buyer',''))}">
    <label class="f">Notes (optional)</label><textarea class="in" id="buyerNotes" placeholder="Colour, plate text, anything staff should know…"></textarea>
    <button class="btn primary" style="width:100%;margin-top:14px" id="checkoutBtn">Place order request</button>` : "";
}
function addToCart(id){
  const i = findItem(id); if(!i) return;
  if(i.ask && !cart[id]) return openAsk(id);   // popup first for ads / custom items
  const have = cart[id]||0;
  if(i.stock >= 0 && have >= i.stock) return toast("No more stock available", true);
  cart[id] = have + 1; renderCart(); toast(i.name + " added");
}
function openAsk(id){
  const i = findItem(id); askId = id;
  $("#askTitle").textContent = "Purchase: " + i.name;
  $("#askPrice").textContent = i.name + " · " + money(i.price, cur(i));
  $("#askLabel").textContent = i.askLabel || "Tell us what you need";
  $("#askText").value = details[id] || "";
  $("#askModal").classList.add("open");
  setTimeout(() => $("#askText").focus(), 50);
}
function confirmAsk(){
  const t = $("#askText").value.trim();
  if(!t) return toast("Please fill this in first", true);
  const i = findItem(askId); if(!i) return;
  if(i.stock === 0) return toast("Sold out", true);
  details[askId] = t; save("ssrp_details_v1", details);
  cart[askId] = 1;
  $("#askModal").classList.remove("open");
  renderCart(); openCart(true); toast(i.name + " added");
}
function openCart(o){ $("#drawer").classList.toggle("open", o); $("#overlay").classList.toggle("open", o); }

async function checkout(){
  const buyer = $("#buyerName").value.trim();
  if(!buyer) return toast("Enter your in-game / Discord name", true);
  save("ssrp_buyer", buyer);
  const lines = Object.entries(cart).map(([id,q]) => ({id:+id, name:findItem(id).name, qty:q, price:findItem(id).price, currency:cur(findItem(id)), link:safeUrl(findItem(id).link), details:details[id]||""}));
  const order = { id: Date.now().toString(36).toUpperCase(), time: new Date().toISOString(), buyer,
    notes: $("#buyerNotes").value.trim(), lines, total: cartTotals(), status: data.settings.statuses[0].id, history: [{status: data.settings.statuses[0].id, time: new Date().toISOString()}] };
  orders.unshift(order); save(ORDKEY, orders);
  // reduce stock
  lines.forEach(l => { const it = findItem(l.id); if(it && it.stock >= 0) it.stock = Math.max(0, it.stock - l.qty); });
  persist();
  const text = orderText(order);
  if(data.settings.webhook){
    try{ await fetch(data.settings.webhook,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({content:"```\n"+text+"\n```"})}); }
    catch(e){ toast("Webhook failed, order saved locally", true); }
  }
  cart = {}; renderAll();
  $("#cartBody").innerHTML = `<div class="empty"><div style="font-size:3rem">✅</div><h3 style="color:var(--text)">Order #${order.id} sent!</h3>
    <p style="margin:10px 0">Copy the summary below and send it to staff on Discord to complete your purchase.</p></div>
    <textarea class="in" readonly style="min-height:150px" id="orderOut">${esc(text)}</textarea>`;
  $("#cartFoot").innerHTML = `<button class="btn primary" style="width:100%" id="copyOrder">Copy order summary</button>`;
}
function orderText(o){
  return `${data.settings.storeName} ORDER #${o.id}\nBuyer: ${o.buyer}\n` +
    o.lines.map(l => `- ${l.qty}x ${l.name} (${money(l.price*l.qty, l.currency)})` + (l.link ? ` ${l.link}` : "") + (l.details ? `\n    Details: ${l.details}` : "")).join("\n") +
    `\nTotal: ${orderTotal(o)}` + (o.notes ? `\nNotes: ${o.notes}` : "");
}
// handles older orders saved with a single number total
function orderTotal(o){ return typeof o.total === "number" ? money(o.total) : fmtTotals(o.total); }

/* ---------- admin ---------- */
let adminTab = "items", editing = null;
function openAdmin(){
  if(admin){ $("#adminModal").classList.add("open"); renderAdmin(); }
  else { $("#loginModal").classList.add("open"); setTimeout(()=>$("#passIn").focus(),50); }
}
function renderAdmin(){
  document.querySelectorAll("#adminTabs .tab").forEach(t => t.classList.toggle("on", t.dataset.tab===adminTab));
  const b = $("#adminBody");
  if(adminTab==="items") b.innerHTML = itemsTab();
  if(adminTab==="orders") b.innerHTML = ordersTab();
  if(adminTab==="settings") b.innerHTML = settingsTab();
  if(adminTab==="data") b.innerHTML = dataTab();
}
function itemsTab(){
  const it = editing === "new" ? {id:0,name:"",category:data.categories[0]||"",price:0,currency:data.settings.currency,link:"",ask:false,askLabel:"",stock:-1,emoji:"📦",badge:"",visible:true,desc:""} : editing ? findItem(editing) : null;
  const form = it ? `<div class="note"><b>${editing==="new"?"Add new item":"Edit item"}</b></div>
    <div class="row2">
      <div><label class="f">Name</label><input class="in" id="f_name" value="${esc(it.name)}"></div>
      <div><label class="f">Category (type a new one to create it)</label><input class="in" id="f_cat" list="catlist" value="${esc(it.category)}"><datalist id="catlist">${data.categories.map(c=>`<option value="${esc(c)}">`).join("")}</datalist></div>
      <div><label class="f">Price</label><input class="in" id="f_price" type="number" min="0" value="${it.price}"></div>
      <div><label class="f">Currency (R$ = Robux, $ = in-game cash, or type your own)</label><input class="in" id="f_currency" list="curlist" value="${esc(it.currency||data.settings.currency)}"><datalist id="curlist"><option value="R$"><option value="$"><option value="£"><option value="€"></datalist></div>
      <div style="grid-column:1/-1"><label class="f">Roblox gamepass link (optional, https://…)</label><input class="in" id="f_link" value="${esc(it.link||"")}" placeholder="https://www.roblox.com/game-pass/123456/Name"></div>
      <div style="grid-column:1/-1"><label class="f"><input type="checkbox" id="f_ask" ${it.ask?"checked":""}> Show a popup asking the buyer for details (great for ads &amp; custom passes)</label>
        <input class="in" id="f_asklabel" value="${esc(it.askLabel||"")}" placeholder="Popup question, e.g. What should your ad say?"></div>
      <div><label class="f">Stock (-1 = unlimited)</label><input class="in" id="f_stock" type="number" min="-1" value="${it.stock}"></div>
      <div><label class="f">Emoji icon</label><input class="in" id="f_emoji" value="${esc(it.emoji)}"></div>
      <div><label class="f">Badge (e.g. New, Sale, Limited)</label><input class="in" id="f_badge" value="${esc(it.badge)}"></div>
    </div>
    <label class="f">Description</label><textarea class="in" id="f_desc">${esc(it.desc)}</textarea>
    <label class="f"><input type="checkbox" id="f_vis" ${it.visible!==false?"checked":""}> Visible in store</label>
    <div style="margin-top:14px;display:flex;gap:8px"><button class="btn primary" id="saveItem">Save item</button><button class="btn" id="cancelEdit">Cancel</button></div><hr style="border-color:var(--line);margin:20px 0">` : "";
  return form + `<div style="margin-bottom:12px"><button class="btn primary" id="newItem">+ Add item</button></div>
  <table><thead><tr><th></th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Shown</th><th></th></tr></thead><tbody>` +
  data.items.map(i => `<tr><td>${esc(i.emoji)}</td><td>${esc(i.name)}</td><td>${esc(i.category)}</td><td>${money(i.price,cur(i))}</td><td>${i.stock<0?"∞":i.stock}</td>
    <td><input type="checkbox" data-vis="${i.id}" ${i.visible!==false?"checked":""}></td>
    <td style="white-space:nowrap"><button class="btn sm" data-edit="${i.id}">Edit</button> <button class="btn sm danger" data-del="${i.id}">Delete</button></td></tr>`).join("") + `</tbody></table>`;
}
let orderFilter = "all";
function ordersTab(){
  const sts = data.settings.statuses;
  if(!orders.length) return `<div class="empty">No orders yet. Orders placed from this browser show up here.<br><small>For orders from all players, set a Discord webhook in Settings.</small></div>`;
  const counts = {}; orders.forEach(o => { const id = statusOf(o.status).id; counts[id] = (counts[id]||0) + 1; });
  const chips = `<div class="chips"><button class="chip ${orderFilter==="all"?"on":""}" data-ofilter="all">All (${orders.length})</button>` +
    sts.map(s => `<button class="chip ${orderFilter===s.id?"on":""}" data-ofilter="${esc(s.id)}">${esc(s.label)} (${counts[s.id]||0})</button>`).join("") + `</div>`;
  const list = orders.filter(o => orderFilter==="all" || statusOf(o.status).id === orderFilter);
  if(!list.length) return chips + `<div class="empty">No orders with this status.</div>`;
  return chips + `<table><thead><tr><th>ID</th><th>Buyer</th><th>Items</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody>` +
    list.map(o => {
      const st = statusOf(o.status);
      const last = (o.history||[]).filter(h => h.status === st.id).pop();
      return `<tr><td>${esc(o.id)}<br><small style="color:var(--muted)">${new Date(o.time).toLocaleString()}</small></td><td>${esc(o.buyer)}</td>
      <td>${o.lines.map(l=>`${l.qty}× ${esc(l.name)}${l.details?`<br><small style="color:var(--accent)">📝 ${esc(l.details)}</small>`:""}`).join("<br>")}${o.notes?`<br><small style="color:var(--muted)">“${esc(o.notes)}”</small>`:""}${o.note?`<br><small style="color:var(--good)">Staff: ${esc(o.note)}</small>`:""}</td>
      <td>${orderTotal(o)}</td>
      <td>${statusPill(o)}<br><select class="in" style="margin-top:6px;padding:5px 8px;width:auto" data-ostatus="${esc(o.id)}">${sts.map(x=>`<option value="${esc(x.id)}" ${x.id===st.id?"selected":""}>${esc(x.label)}</option>`).join("")}</select>
        ${last?`<br><small style="color:var(--muted)">${new Date(last.time).toLocaleString()}</small>`:""}</td>
      <td style="white-space:nowrap"><button class="btn sm" data-onote="${esc(o.id)}">Note</button> <button class="btn sm danger" data-ord="${esc(o.id)}|remove">✕</button></td></tr>`;
    }).join("") + `</tbody></table>`;
}
function settingsTab(){
  const s = data.settings;
  return `<div class="row2">
    <div><label class="f">Store name</label><input class="in" id="s_storeName" value="${esc(s.storeName)}"></div>
    <div><label class="f">Currency symbol</label><input class="in" id="s_currency" value="${esc(s.currency)}"></div>
    <div><label class="f">Hero tag</label><input class="in" id="s_tagline" value="${esc(s.tagline)}"></div>
    <div><label class="f">New admin passcode (blank = keep current, min 12 characters)</label><input class="in" id="s_passcode" type="password" autocomplete="new-password" placeholder="Enter a new passcode"></div>
  </div>
  <label class="f">Hero text</label><input class="in" id="s_heroText" value="${esc(s.heroText)}">
  <label class="f">Announcement banner (leave blank to hide)</label><input class="in" id="s_announcement" value="${esc(s.announcement)}">
  <label class="f">Discord webhook URL (optional, sends new orders to a staff channel)</label><input class="in" id="s_webhook" value="${esc(s.webhook)}" placeholder="https://discord.com/api/webhooks/…">
  <div class="note" style="margin-top:14px">⚠ This is a static GitHub page: the webhook is visible in the page source, and the passcode is checked in the browser (only its hash is stored). That keeps casual visitors out but is not real server security, so never reuse a password from anywhere else.</div>
  <button class="btn primary" id="saveSettings">Save settings</button>
  <hr style="border-color:var(--line);margin:20px 0">
  <label class="f">Order statuses (the first one is given to every new order)</label>
  ${s.statuses.map((st,i)=>`<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px"><input type="color" value="${esc(st.color)}" data-stcolor="${i}" style="width:42px;height:36px;border:0;background:none;padding:0"><input class="in" value="${esc(st.label)}" data-stlabel="${i}"><button class="btn sm" data-stup="${i}" ${i===0?"disabled":""}>↑</button><button class="btn sm danger" data-delstatus="${i}">✕</button></div>`).join("")}
  <div style="display:flex;gap:8px;margin-bottom:6px"><input class="in" id="newStatus" placeholder="New status, e.g. Awaiting payment"><button class="btn" id="addStatus">Add</button></div>
  <hr style="border-color:var(--line);margin:20px 0">
  <label class="f">Manage categories</label>
  <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px">${data.categories.map(c=>`<span class="chip">${esc(c)} <a href="#" data-delcat="${esc(c)}" style="color:var(--bad);text-decoration:none">✕</a></span>`).join("")}</div>
  <div style="display:flex;gap:8px"><input class="in" id="newCat" placeholder="New category"><button class="btn" id="addCat">Add</button></div>`;
}
function dataTab(){
  return `<div class="note"><b>How to publish changes on GitHub:</b> Admin edits are saved only in <i>your</i> browser. Click <b>Export</b>, paste the result over the <code>DEFAULTS</code> block in <code>index.html</code>, commit, and everyone will see it.</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
    <button class="btn primary" id="exportBtn">Export store data</button>
    <button class="btn" id="downloadBtn">Download JSON</button>
    <button class="btn danger" id="resetBtn">Reset to defaults</button>
  </div>
  <label class="f">Export / Import (paste JSON here to import)</label>
  <textarea class="in" id="dataBox" style="min-height:220px;font-family:monospace;font-size:.8rem"></textarea>
  <button class="btn" style="margin-top:10px" id="importBtn">Import from box</button>`;
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("button, a, .overlay"); if(!t) return;
  const d = t.dataset;
  if(d.cat) { filter.cat = d.cat; renderChips(); renderGrid(); }
  if(d.add) addToCart(d.add);
  if(d.editask){ e.preventDefault(); openAsk(d.editask); }
  if(d.inc){ const i=findItem(d.inc); if(i.stock>=0 && cart[d.inc]>=i.stock) return toast("No more stock",true); cart[d.inc]++; renderCart(); }
  if(d.dec){ cart[d.dec]--; if(cart[d.dec]<=0) delete cart[d.dec]; renderCart(); }
  if(d.close) $("#"+d.close).classList.remove("open");
  if(d.tab){ adminTab = d.tab; editing = null; renderAdmin(); }
  if(d.edit){ editing = +d.edit; renderAdmin(); }
  if(d.del){ if(confirm("Delete this item?")){ data.items = data.items.filter(i=>i.id!=d.del); persist(); renderAll(); renderAdmin(); } }
  if(d.delcat){ e.preventDefault(); if(confirm("Remove category? Items keep their category text.")){ data.categories = data.categories.filter(c=>c!==d.delcat); persist(); renderAll(); renderAdmin(); } }
  if(d.ofilter){ orderFilter = d.ofilter; renderAdmin(); }
  if(d.onote){ const o = orders.find(x=>x.id===d.onote); if(o){ const v = prompt("Staff note for order #"+o.id+" (visible to staff only):", o.note||""); if(v!==null){ o.note = v.trim(); save(ORDKEY, orders); renderAdmin(); } } }
  if(d.delstatus!==undefined){ if(data.settings.statuses.length<=1) return toast("Keep at least one status", true);
    if(confirm("Remove this status? Orders using it will show as the first status.")){ data.settings.statuses.splice(+d.delstatus,1); persist(); renderAdmin(); } }
  if(d.stup!==undefined){ const i=+d.stup, st=data.settings.statuses; if(i>0){ [st[i-1],st[i]]=[st[i],st[i-1]]; persist(); renderAdmin(); } }
  if(d.ord){ const [id,act] = d.ord.split("|"); const o = orders.find(x=>x.id===id);
    if(act==="remove") orders = orders.filter(x=>x.id!==id); else if(o) o.status = act;
    save(ORDKEY, orders); renderAdmin(); }
  switch(t.id){
    case "cartBtn": openCart(true); break;
    case "closeCart": case "overlay": openCart(false); break;
    case "checkoutBtn": checkout(); break;
    case "askGo": confirmAsk(); break;
    case "copyOrder": $("#orderOut").select(); navigator.clipboard?.writeText($("#orderOut").value); toast("Copied!"); break;
    case "adminBtn": openAdmin(); break;
    case "loginGo": tryLogin(); break;
    case "logoutBtn": admin=false; sessionStorage.removeItem(AUTHKEY); $("#adminModal").classList.remove("open"); toast("Admin locked"); break;
    case "newItem": editing="new"; renderAdmin(); break;
    case "cancelEdit": editing=null; renderAdmin(); break;
    case "saveItem": saveItem(); break;
    case "saveSettings": saveSettings(); break;
    case "addCat": { const v=$("#newCat").value.trim(); if(v && !data.categories.includes(v)){ data.categories.push(v); persist(); renderAll(); renderAdmin(); } break; }
    case "addStatus": { const label = $("#newStatus").value.trim(); if(!label) return toast("Type a status name", true);
      let id = label.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "status";
      while(data.settings.statuses.some(x=>x.id===id)) id += "-" + Math.random().toString(36).slice(2,5);
      data.settings.statuses.push({id, label, color:"#8fa0c2"}); persist(); renderAdmin(); break; }
    case "exportBtn": $("#dataBox").value = JSON.stringify({categories:data.categories,items:data.items,settings:data.settings},null,2); break;
    case "downloadBtn": { const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"})); a.download="springfield-store.json"; a.click(); break; }
    case "importBtn": try{ const j=JSON.parse($("#dataBox").value); if(!j.items||!j.categories) throw 0; data=Object.assign(clone(DEFAULTS),j); data.settings=Object.assign({},DEFAULTS.settings,j.settings); ensureStatuses(); persist(); renderAll(); renderAdmin(); toast("Imported!"); }catch(_){ toast("Invalid JSON",true); } break;
    case "resetBtn": if(confirm("Reset everything to the defaults in the file?")){ data=clone(DEFAULTS); persist(); renderAll(); renderAdmin(); } break;
  }
});
document.addEventListener("change", e => {
  const ds = e.target.dataset;
  if(ds.vis){ findItem(ds.vis).visible = e.target.checked; persist(); renderGrid(); }
  if(ds.ostatus){ const o = orders.find(x=>x.id===ds.ostatus); if(o){ o.status = e.target.value; (o.history = o.history||[]).push({status:o.status, time:new Date().toISOString()}); save(ORDKEY, orders); renderAdmin(); toast("Order #"+o.id+" → "+statusOf(o.status).label); } }
  if(ds.stlabel!==undefined){ const v = e.target.value.trim(); if(v){ data.settings.statuses[+ds.stlabel].label = v; persist(); } }
  if(ds.stcolor!==undefined){ data.settings.statuses[+ds.stcolor].color = e.target.value; persist(); }
});
$("#search").addEventListener("input", e => { filter.q = e.target.value.toLowerCase().trim(); renderGrid(); });
$("#sort").addEventListener("change", e => { filter.sort = e.target.value; renderGrid(); });
$("#passIn").addEventListener("keydown", e => { if(e.key==="Enter") tryLogin(); });
document.querySelectorAll(".modal").forEach(m => m.addEventListener("mousedown", e => { if(e.target===m) m.classList.remove("open"); }));

async function sha256(t){
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,"0")).join("");
}
async function tryLogin(){
  if(!(window.crypto && crypto.subtle)) return toast("Open the page over https:// to use admin login", true);
  const ok = (await sha256($("#passIn").value)) === data.settings.passHash;
  $("#passIn").value = "";
  if(ok){
    admin = true; sessionStorage.setItem(AUTHKEY,"1");
    $("#loginModal").classList.remove("open"); $("#adminModal").classList.add("open"); renderAdmin();
  } else toast("Wrong passcode", true);
}
function saveItem(){
  const name = $("#f_name").value.trim(); if(!name) return toast("Name required", true);
  const cat = $("#f_cat").value.trim() || "Misc";
  if(!data.categories.includes(cat)) data.categories.push(cat);
  const link = $("#f_link").value.trim();
  if(link && !safeUrl(link)) return toast("Link must start with https://", true);
  const rec = { name, category:cat, price:Math.max(0,+$("#f_price").value||0), currency:$("#f_currency").value.trim()||data.settings.currency, link, ask:$("#f_ask").checked, askLabel:$("#f_asklabel").value.trim(), stock:Math.max(-1,parseInt($("#f_stock").value)||0),
    emoji:$("#f_emoji").value.trim()||"📦", badge:$("#f_badge").value.trim(), desc:$("#f_desc").value.trim(), visible:$("#f_vis").checked };
  if(editing==="new") data.items.push(Object.assign({id:Math.max(0,...data.items.map(i=>i.id))+1}, rec));
  else Object.assign(findItem(editing), rec);
  editing = null; persist(); renderAll(); renderAdmin(); toast("Item saved");
}
async function saveSettings(){
  const np = $("#s_passcode").value;
  if(np){
    if(np.length < 12) return toast("Passcode must be at least 12 characters", true);
    if(!(window.crypto && crypto.subtle)) return toast("Open the page over https:// to change the passcode", true);
    data.settings.passHash = await sha256(np);
  }
  ["storeName","currency","tagline","heroText","announcement","webhook"].forEach(k => data.settings[k] = $("#s_"+k).value.trim());
  persist(); renderAll(); renderAdmin(); toast(np ? "Settings saved, new passcode set" : "Settings saved");
}

renderAll();
</script>
